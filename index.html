<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love ❤️</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Arial;
color:white;
}

.container{
text-align:center;
z-index:2;
}

.title{
font-size:40px;
color:pink;
margin-bottom:20px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{
text-shadow:0 0 10px pink;
}
to{
text-shadow:0 0 30px red;
}
}

.timer{
font-size:25px;
margin-bottom:30px;
}

.heart{
position:relative;
width:200px;
height:200px;
background:red;
transform:rotate(-45deg);
margin:auto;
animation:beat 1s infinite;
}

.heart:before,
.heart:after{
content:"";
position:absolute;
width:200px;
height:200px;
background:red;
border-radius:50%;
}

.heart:before{
top:-100px;
left:0;
}

.heart:after{
left:100px;
top:0;
}

@keyframes beat{
0%{
transform:rotate(-45deg) scale(1);
}
50%{
transform:rotate(-45deg) scale(1.1);
}
100%{
transform:rotate(-45deg) scale(1);
}
}

.heart img{
position:absolute;
width:120px;
height:120px;
object-fit:cover;
top:40px;
left:40px;
transform:rotate(45deg);
border-radius:20px;
border:4px solid white;
z-index:5;
}

.message{
margin-top:40px;
font-size:28px;
color:pink;
}

.floating-heart{
position:absolute;
font-size:25px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100vh);
opacity:0;
}
}

button{
margin-top:30px;
padding:15px 25px;
font-size:20px;
border:none;
border-radius:15px;
cursor:pointer;
}

.no{
position:absolute;
}

</style>
</head>

<body>

<audio autoplay loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<div class="container">

<div class="title">
ANH YÊU TRÀ MY RẤT NHIỀU ❤️
</div>

<div class="timer" id="loveTimer"></div>

<div class="heart">
<img src="couple.jpg">
</div>

<div class="message">
ANH MUỐN CƯỚI EM LÀM VỢ 💍
</div>

<button onclick="alert('Anh yêu em 😆')">
EM CŨNG YÊU ANH
</button>

</div>

<script>

const startDate = new Date("2025-06-04");

function updateTimer(){

const now = new Date();

const diff = now - startDate;

const days = Math.floor(diff / (1000*60*60*24));

document.getElementById("loveTimer").innerHTML =
"Chúng ta đã yêu nhau " + days + " ngày 💖";
}

setInterval(updateTimer,1000);

function createHeart(){

const heart = document.createElement("div");

heart.className = "floating-heart";

heart.innerHTML = "❤️";

heart.style.left = Math.random()*100 + "vw";

heart.style.animationDuration =
(Math.random()*3 + 2) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
